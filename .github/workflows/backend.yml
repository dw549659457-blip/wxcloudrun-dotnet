name: CSharp backend validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: python3 scripts/generate-cloudrun-sql.py --check
      - run: dotnet restore aspnetapp.sln --locked-mode
      - run: dotnet test tests/Business.Tests.csproj --no-restore --logger 'console;verbosity=minimal'
      - run: dotnet publish aspnetapp -c Release --no-restore -o out/api /p:UseAppHost=false
