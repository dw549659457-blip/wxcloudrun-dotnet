name: CSharp and frontend validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package:miniprogram
      - run: python3 scripts/generate-cloudrun-sql.py --check
      - run: python3 scripts/generate-backoffice-upgrade-sql.py --check
      - run: dotnet restore aspnetapp.sln --locked-mode
      - run: dotnet test tests/Business.Tests.csproj --no-restore --logger 'console;verbosity=minimal'
      - run: dotnet publish aspnetapp -c Release --no-restore -o out/api /p:UseAppHost=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: vegetable-miniprogram-import
          path: |
            out/miniprogram-delivery/vegetable-miniprogram-import.zip
            out/miniprogram-delivery/vegetable-miniprogram-import.zip.sha256
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          path: |
            artifacts/frontend/*.png
            test-results/**
          retention-days: 7
